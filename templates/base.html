<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Кинотека{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'kino-bg': '#141414',
                        'kino-card': '#1f1f1f',
                        'kino-accent': '#ff6600',
                        'kino-accent-hover': '#e65c00',
                        'kino-text': '#ffffff',
                        'kino-text-secondary': '#a3a3a3',
                    },
                    fontFamily: {
                        'inter': ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #141414;
            color: #ffffff;
        }
        
        .movie-card {
            text-decoration: none !important;
            color: inherit !important;
            display: flex !important;
            flex-direction: column !important;
            height: 100% !important;
            background-color: #1f1f1f !important;
            border-radius: 0.75rem;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            transition: all 300ms ease;
            position: relative;
            z-index: 1;
        }
        
        .movie-card:hover {
            transform: scale(1.05) !important;
            z-index: 10 !important;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5) !important;
        }
        
        .movie-card-poster {
            flex: 0 0 auto !important;
            width: 100% !important;
        }
        
        .movie-card-poster img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 300ms ease;
        }
        
        .movie-card:hover .movie-card-poster img {
            transform: scale(1.1);
        }
        
        .movie-card-info {
            flex: 1 1 auto !important;
            display: flex !important;
            flex-direction: column !important;
            justify-content: flex-start !important;
        }
        
        .movie-card-info h3 {
            margin: 0 !important;
        }
        
        .movie-card-info p {
            margin: 0 !important;
        }
        
        .rating-badge {
            transition: all 0.2s ease;
        }
    </style>
</head>
<body class="bg-kino-bg min-h-screen flex flex-col">
    <!-- Navbar -->
    <nav class="bg-kino-card border-b border-gray-800 sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3">
            <div class="flex items-center justify-between gap-4">
                <!-- Logo -->
                <a href="{% url 'home' %}" class="text-2xl font-bold text-kino-accent hover:text-kino-accent-hover transition-colors">
                    <i class="fas fa-film mr-2"></i>Кинотека
                </a>
                
                <!-- Search Bar (Center) -->
                <form action="{% url 'home' %}" method="GET" class="flex-1 max-w-xl hidden md:flex">
                    <div class="relative w-full">
                        <input 
                            type="text" 
                            name="q" 
                            value="{{ query|default:'' }}"
                            placeholder="Поиск фильмов..." 
                            class="w-full bg-gray-800 text-white placeholder-gray-400 rounded-lg px-4 py-2 pl-10 focus:outline-none focus:ring-2 focus:ring-kino-accent border border-gray-700"
                        >
                        <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                    </div>
                    <button type="submit" class="ml-2 bg-kino-accent hover:bg-kino-accent-hover text-white px-4 py-2 rounded-lg transition-colors">
                        Найти
                    </button>
                </form>
                
                <!-- User Actions (Right) -->
                <div class="flex items-center gap-3">
                    {% if user.is_authenticated %}
                        <a href="{% url 'add_movie' %}" class="hidden sm:flex items-center gap-2 bg-kino-accent hover:bg-kino-accent-hover text-white px-4 py-2 rounded-lg transition-colors">
                            <i class="fas fa-upload"></i>
                            <span>Загрузить</span>
                        </a>
                        <div class="flex items-center gap-2 text-kino-text">
                            <i class="fas fa-user-circle text-xl"></i>
                            <span class="hidden sm:inline">{{ user.username }}</span>
                        </div>
                        <a href="{% url 'logout' %}" class="text-kino-text-secondary hover:text-kino-accent transition-colors p-2" title="Выйти">
                            <i class="fas fa-sign-out-alt"></i>
                        </a>
                    {% else %}
                        <a href="{% url 'login' %}" class="text-kino-text hover:text-kino-accent transition-colors px-3 py-2">
                            Войти
                        </a>
                        <a href="{% url 'register' %}" class="bg-kino-accent hover:bg-kino-accent-hover text-white px-4 py-2 rounded-lg transition-colors">
                            Регистрация
                        </a>
                    {% endif %}
                </div>
            </div>
            
            <!-- Mobile Search -->
            <form action="{% url 'home' %}" method="GET" class="mt-3 md:hidden flex">
                <div class="relative w-full">
                    <input 
                        type="text" 
                        name="q" 
                        value="{{ query|default:'' }}"
                        placeholder="Поиск фильмов..." 
                        class="w-full bg-gray-800 text-white placeholder-gray-400 rounded-lg px-4 py-2 pl-10 focus:outline-none focus:ring-2 focus:ring-kino-accent border border-gray-700"
                    >
                    <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                </div>
            </form>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-kino-card border-t border-gray-800 mt-auto">
        <div class="container mx-auto px-4 py-6">
            <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="text-kino-text-secondary">
                    <span class="text-kino-accent font-bold">Кинотека</span> &copy; {% now "Y" %}. Все права защищены.
                </div>
                <div class="flex items-center gap-4">
                    <a href="#" class="text-kino-text-secondary hover:text-kino-accent transition-colors">
                        <i class="fab fa-vk text-xl"></i>
                    </a>
                    <a href="#" class="text-kino-text-secondary hover:text-kino-accent transition-colors">
                        <i class="fab fa-telegram text-xl"></i>
                    </a>
                    <a href="#" class="text-kino-text-secondary hover:text-kino-accent transition-colors">
                        <i class="fab fa-youtube text-xl"></i>
                    </a>
                </div>
            </div>
        </div>
    </footer>
</body>
</html>
